<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- USA Red Scarlet Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b22234"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan / Bright Blue Pulse Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0c2340" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Top Highlight -->
  <path d="M 12 34 Q 60 18 108 34" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>

  <!-- Top 3 American Stars -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Center Star -->
    <polygon points="60,18 62.5,25 70,25 64,29.5 66.5,36.5 60,32 53.5,36.5 56,29.5 50,25 57.5,25" transform="scale(0.8) translate(15, 6)"/>
    <!-- Left Star -->
    <polygon points="40,24 42,29 48,29 43.5,32.5 45.5,37.5 40,34 34.5,37.5 36.5,32.5 32,29 38,29" transform="scale(0.65) translate(22, 16)"/>
    <!-- Right Star -->
    <polygon points="80,24 82,29 88,29 83.5,32.5 85.5,37.5 80,34 74.5,37.5 76.5,32.5 72,29 78,29" transform="scale(0.65) translate(42, 16)"/>
  </g>

  <!-- Dynamic 'V' Monogram + Shield Ribbons -->
  <!-- Left Wing of 'V' (Old Glory Navy & White Stripes) -->
  <path d="M 24 38 L 44 38 L 60 84 L 46 84 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 32 38 L 42 38 L 54 74 L 47 74 Z" fill="url(#cyanGrad)"/>

  <!-- Right Wing of 'V' (USA Scarlet Red Stripes) -->
  <path d="M 96 38 L 76 38 L 60 84 L 74 84 Z" fill="url(#redGrad)"/>
  <path d="M 88 38 L 78 38 L 66 74 L 73 74 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 80 38 L 76 38 L 64 68 L 67 68 Z" fill="url(#redGrad)"/>

  <!-- Center Slot Discovery Checkmark & Radar Pulse Emblem -->
  <!-- Central Calendar / Appointment Tile -->
  <rect x="47" y="44" width="26" height="26" rx="6" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Calendar Top Red Stripe -->
  <rect x="47" y="44" width="26" height="7" rx="3" fill="#dc2626"/>

  <!-- Glowing Live Checkmark inside Calendar -->
  <path d="M 52 58 L 58 64 L 68 52" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Bottom Fast-Alert Lightning Chevron -->
  <polygon points="60,88 66,78 60,80 64,72 54,82 60,81" fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>

