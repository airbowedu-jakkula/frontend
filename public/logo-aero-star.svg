<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <!-- Deep Navy to Vibrant Cobalt Gradient -->
    <linearGradient id="aeroNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Hyper Scarlet to Crimson Red Ribbon -->
    <linearGradient id="aeroRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Electric Cyan Velocity Ribbon -->
    <linearGradient id="aeroCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- 24K Gold Radiant Star Gradient -->
    <linearGradient id="aeroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="aeroDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0c2340" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle App Tile with Glass Frost Effect -->
  <rect x="8" y="8" width="124" height="124" rx="32" fill="url(#aeroNavy)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#aeroDrop)"/>
  
  <!-- Subtle Internal Radial Ambient Lighting -->
  <circle cx="70" cy="40" r="50" fill="#38bdf8" opacity="0.08"/>

  <!-- ================= 3D AERO-STRIPES 'V' MONOGRAM ================= -->
  
  <!-- Ribbon 1: Left Wing Navy/Cyan Velocity Stripe -->
  <path d="M 28 32 C 34 32 44 36 50 48 L 70 96 L 56 96 L 24 44 C 22 40 24 32 28 32 Z" fill="url(#aeroCyan)"/>

  <!-- Ribbon 2: Inner Pure White Translucent Geo Stripe -->
  <path d="M 46 32 L 58 32 L 70 66 L 62 66 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Ribbon 3: Right Wing Scarlet Red Ascending Jet Stream -->
  <path d="M 112 32 C 106 32 96 36 90 48 L 70 96 L 84 96 L 116 44 C 118 40 116 32 112 32 Z" fill="url(#aeroRed)"/>

  <!-- Ribbon 4: Red Internal Accent Stripe -->
  <path d="M 94 32 L 82 32 L 70 66 L 78 66 Z" fill="#ffffff" opacity="0.9"/>

  <!-- ================= CENTER GUILDING AMERICAN NORTH STAR & LIVE RADAR PULSE ================= -->
  
  <!-- Radar Slot Aperture Circle -->
  <circle cx="70" cy="52" r="16" fill="#061224" stroke="url(#aeroGold)" stroke-width="2"/>
  
  <!-- Pulsing Concentric Ring -->
  <circle cx="70" cy="52" r="22" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 8-Pointed Precision American Guiding Star (Freedom & Direction) -->
  <!-- Vertical/Horizontal Primary Rays -->
  <polygon points="70,38 72.5,49 84,52 72.5,55 70,66 67.5,55 56,52 67.5,49" fill="url(#aeroGold)"/>
  <!-- Diagonal Secondary Rays -->
  <polygon points="70,43 72,49 78,47 73,52 76,58 70,54 64,58 67,52 62,47 68,49" fill="#ffffff" opacity="0.9"/>

  <!-- Live Green Slot Discovery Spark at Vertex -->
  <circle cx="70" cy="96" r="4.5" fill="#10b981"/>
  <circle cx="70" cy="96" r="7" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
</svg>

