<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="spdNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="spdRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b22234"/>
    </linearGradient>

    <linearGradient id="spdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="spdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0c2340" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Futuristic Rounded Octagon / Shield -->
  <polygon points="40,12 100,12 128,40 128,100 100,128 40,128 12,100 12,40" fill="url(#spdNavy)" stroke="url(#spdGold)" stroke-width="2" filter="url(#spdShadow)"/>

  <!-- Left Speed Slash (USA Blue & White) -->
  <path d="M 28 36 L 52 36 L 68 94 L 46 94 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 38 36 L 48 36 L 60 84 L 52 84 Z" fill="#38bdf8"/>

  <!-- Right Speed Slash (USA Red) -->
  <path d="M 112 36 L 88 36 L 72 94 L 94 94 Z" fill="url(#spdRed)"/>
  <path d="M 102 36 L 92 36 L 80 84 L 88 84 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Central Interlocking Checkmark (Slot Approval) -->
  <path d="M 52 64 L 66 78 L 92 48" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top 3 Patriotic Gold Stars -->
  <g fill="url(#spdGold)">
    <polygon points="70,20 71.5,23.5 75,23.5 72,25.5 73.5,29 70,27 66.5,29 68,25.5 65,23.5 68.5,23.5"/>
    <polygon points="52,24 53.5,27.5 57,27.5 54,29.5 55.5,33 52,31 48.5,33 50,29.5 47,27.5 50.5,27.5" transform="scale(0.8) translate(14, 5)"/>
    <polygon points="88,24 89.5,27.5 93,27.5 90,29.5 91.5,33 88,31 84.5,33 86,29.5 83,27.5 86.5,27.5" transform="scale(0.8) translate(21, 5)"/>
  </g>
</svg>

