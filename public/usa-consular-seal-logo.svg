<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="sealNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b30"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="sealRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b22234"/>
    </linearGradient>
  </defs>

  <!-- Outer Concentric Gold Embossed Ring -->
  <circle cx="70" cy="70" r="66" fill="url(#sealNavy)" stroke="url(#sealGold)" stroke-width="4"/>
  <circle cx="70" cy="70" r="58" fill="none" stroke="url(#sealGold)" stroke-width="1.5" stroke-dasharray="2,3"/>

  <!-- Circular Outer Text / Stars -->
  <g fill="url(#sealGold)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.1em">
    <!-- Top Arc Stars -->
    <polygon points="70,12 71.5,15 75,15 72,17 73.5,20 70,18 66.5,20 68,17 65,15 68.5,15" fill="url(#sealGold)"/>
    <polygon points="50,16 51.5,19 55,19 52,21 53.5,24 50,22 46.5,24 48,21 45,19 48.5,19" fill="url(#sealGold)" transform="scale(0.8) translate(12, 3)"/>
    <polygon points="90,16 91.5,19 95,19 92,21 93.5,24 90,22 86.5,24 88,21 85,19 88.5,19" fill="url(#sealGold)" transform="scale(0.8) translate(22, 3)"/>
    <polygon points="34,26 35.5,29 39,29 36,31 37.5,34 34,32 30.5,34 32,31 29,29 32.5,29" fill="url(#sealGold)" transform="scale(0.8) translate(8, 8)"/>
    <polygon points="106,26 107.5,29 111,29 108,31 109.5,34 106,32 102.5,34 104,31 101,29 104.5,29" fill="url(#sealGold)" transform="scale(0.8) translate(26, 8)"/>
  </g>

  <!-- Central USA Flag Shield -->
  <path d="M 40 40 L 100 40 L 100 76 C 100 96 70 114 70 114 C 70 114 40 96 40 76 Z" fill="#ffffff" stroke="url(#sealGold)" stroke-width="2.5"/>
  
  <!-- Vertical Red Stripes -->
  <rect x="42" y="56" width="8" height="26" fill="url(#sealRed)"/>
  <rect x="58" y="56" width="8" height="38" fill="url(#sealRed)"/>
  <rect x="74" y="56" width="8" height="38" fill="url(#sealRed)"/>
  <rect x="90" y="56" width="8" height="26" fill="url(#sealRed)"/>

  <!-- Blue Chief Banner -->
  <rect x="40" y="40" width="60" height="16" fill="url(#sealNavy)"/>
  
  <!-- 3 Stars in Chief -->
  <g fill="#ffffff" transform="translate(48, 44)">
    <polygon points="6,1 7.5,4 10,4 8,5.5 9,8 6,6.5 3,8 4,5.5 2,4 4.5,4" transform="scale(0.7) translate(4,1)"/>
    <polygon points="6,1 7.5,4 10,4 8,5.5 9,8 6,6.5 3,8 4,5.5 2,4 4.5,4" transform="scale(0.7) translate(22,1)"/>
    <polygon points="6,1 7.5,4 10,4 8,5.5 9,8 6,6.5 3,8 4,5.5 2,4 4.5,4" transform="scale(0.7) translate(40,1)"/>
  </g>

  <!-- Center Visa Appointment Tile & Stamp -->
  <circle cx="70" cy="76" r="16" fill="#071b30" stroke="url(#sealGold)" stroke-width="2"/>
  <rect x="62" y="68" width="16" height="3" rx="1" fill="#dc2626"/>
  <path d="M 64 76 L 68 80 L 76 72" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ribbon Scroll at Bottom -->
  <path d="M 32 118 Q 70 126 108 118 Q 70 132 32 118 Z" fill="url(#sealGold)"/>
</svg>

