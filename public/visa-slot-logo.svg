<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b22234"/>
    </linearGradient>

    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0c2340" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= LOGO ICON EMBLEM ================= -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logoShieldGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#logoShadow)"/>
    
    <!-- Stars -->
    <g fill="url(#logoGoldGrad)">
      <polygon points="40,11 41.5,15.5 46,15.5 42.5,18.5 44,23 40,20 36,23 37.5,18.5 34,15.5 38.5,15.5" transform="scale(0.85) translate(7, 3)"/>
      <polygon points="26,16 27.5,20 31,20 28,22.5 29.5,26 26,23.5 22.5,26 24,22.5 21,20 24.5,20" transform="scale(0.7) translate(11, 10)"/>
      <polygon points="54,16 55.5,20 59,20 56,22.5 57.5,26 54,23.5 50.5,26 52,22.5 49,20 52.5,20" transform="scale(0.7) translate(23, 10)"/>
    </g>

    <!-- 'V' Wings -->
    <path d="M 16 26 L 30 26 L 40 60 L 30 60 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 22 26 L 28 26 L 36 53 L 31 53 Z" fill="url(#logoCyanGrad)"/>

    <path d="M 64 26 L 50 26 L 40 60 L 50 60 Z" fill="url(#logoRedGrad)"/>
    <path d="M 58 26 L 52 26 L 44 53 L 49 53 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Center Calendar Tile -->
    <rect x="31" y="30" width="18" height="18" rx="4" fill="#0f172a" stroke="url(#logoGoldGrad)" stroke-width="1.5"/>
    <rect x="31" y="30" width="18" height="5" rx="2" fill="#dc2626"/>
    <path d="M 34 40 L 39 44 L 46 36" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

    <!-- Fast Lightning Chevron -->
    <polygon points="40,64 44,57 40,58 43,52 36,60 40,59" fill="url(#logoGoldGrad)"/>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(106, 22)">
    <!-- Primary Brand Name -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Bricolage Grotesque', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#0c2340">
      VisaSlot<tspan fill="#dc2626">Updates</tspan>
    </text>

    <!-- Tagline & Live Indicator -->
    <g transform="translate(0, 48)">
      <rect x="0" y="-12" width="6" height="6" rx="3" fill="#10b981"/>
      <text x="14" y="-6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#64748b" text-transform="uppercase">
        U.S. Visa Appointment Tracker
      </text>
    </g>
  </g>
</svg>

