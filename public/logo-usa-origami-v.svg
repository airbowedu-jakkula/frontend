<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="orgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="orgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="orgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="orgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0c2340" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean Circle Base -->
  <circle cx="70" cy="70" r="62" fill="#0c192c" stroke="#3b82f6" stroke-width="2" filter="url(#orgShadow)"/>

  <!-- Origami USA Flag Fold 'V' -->
  <!-- Left Side: Deep Navy Blue Plane -->
  <polygon points="30,34 56,34 70,82 50,82" fill="url(#orgNavy)"/>
  
  <!-- Center Fold: Pure White Clean Diamond -->
  <polygon points="56,34 70,34 70,82 56,34" fill="#ffffff" opacity="0.95"/>

  <!-- Right Side: Scarlet Red Flag Ribbon Fold -->
  <polygon points="110,34 84,34 70,82 90,82" fill="url(#orgRed)"/>

  <!-- Overlapping Flag Stripe Facet -->
  <polygon points="70,34 84,34 70,82" fill="#f87171"/>

  <!-- Apex Gold Chrono Anchor -->
  <polygon points="70,104 60,82 70,86 80,82" fill="url(#orgGold)"/>

  <!-- Floating Golden Star of Liberty above the 'V' -->
  <polygon points="70,16 73,23 81,23 75,28 77,36 70,31 63,36 65,28 59,23 67,23" fill="url(#orgGold)"/>

  <!-- Live Verified Emerald Dot at Center Intersection -->
  <circle cx="70" cy="58" r="6" fill="#10b981"/>
  <circle cx="70" cy="58" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
</svg>

