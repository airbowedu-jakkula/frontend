<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="portalNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182f"/>
      <stop offset="50%" stop-color="#0f294a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="portalRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="portalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="portalDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#07182f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Capsule -->
  <rect x="8" y="8" width="124" height="124" rx="32" fill="url(#portalNavy)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#portalDrop)"/>

  <!-- ================= ARCHITECTURAL USA GATEWAY ARCH & PASSPORT APERTURE ================= -->
  
  <!-- Outer Arch Gateway Ribbon (Old Glory Red) -->
  <path d="M 32 104 L 32 60 C 32 36 50 22 70 22 C 90 22 108 36 108 60 L 108 104 L 92 104 L 92 60 C 92 46 82 38 70 38 C 58 38 48 46 48 60 L 48 104 Z" fill="url(#portalRed)"/>

  <!-- Inner Dynamic 'V' Flight Path (White & Navy) -->
  <path d="M 42 50 L 54 50 L 70 88 L 62 88 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 98 50 L 86 50 L 70 88 L 78 88 Z" fill="#38bdf8"/>

  <!-- 3 American Arch Stars -->
  <g fill="url(#portalGold)">
    <polygon points="70,16 71.5,20 76,20 72.5,22.5 74,27 70,24 66,27 67.5,22.5 64,20 68.5,20" transform="scale(0.8) translate(18, 2)"/>
    <polygon points="50,22 51.5,26 56,26 52.5,28.5 54,33 50,30 46,33 47.5,28.5 44,26 48.5,26" transform="scale(0.65) translate(28, 9)"/>
    <polygon points="90,22 91.5,26 96,26 92.5,28.5 94,33 90,30 86,33 87.5,28.5 84,26 88.5,26" transform="scale(0.65) translate(46, 9)"/>
  </g>

  <!-- Center Visa Appointment Discovery Checkmark -->
  <circle cx="70" cy="62" r="14" fill="#07182f" stroke="url(#portalGold)" stroke-width="2"/>
  <path d="M 63 62 L 68 67 L 77 56" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Fast-Alert Horizon Line -->
  <line x1="28" y1="104" x2="112" y2="104" stroke="url(#portalGold)" stroke-width="3" stroke-linecap="round"/>
</svg>

