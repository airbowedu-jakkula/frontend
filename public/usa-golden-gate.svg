<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="gg-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#gg-sky)" />

  <!-- Sunset Sun Glow -->
  <circle cx="200" cy="160" r="45" fill="#fed7aa" opacity="0.4" />

  <!-- San Francisco Bay Water -->
  <rect x="0" y="180" width="400" height="60" fill="#0f2347" />
  <path d="M0 185 Q 100 190 200 185 T 400 185 L 400 240 L 0 240 Z" fill="#1e3a8a" opacity="0.3" />

  <!-- Marin Headlands Hills on Left -->
  <path d="M0 240 L0 150 Q 80 130 140 180 L0 240 Z" fill="#1e293b" />

  <!-- Golden Gate Bridge (International Orange #c2410c / #ea580c) -->
  <!-- Tower 1 (x: 150) -->
  <rect x="145" y="45" width="10" height="150" fill="#ea580c" />
  <rect x="160" y="45" width="10" height="150" fill="#ea580c" />
  <rect x="142" y="65" width="31" height="6" fill="#c2410c" />
  <rect x="142" y="95" width="31" height="6" fill="#c2410c" />
  <rect x="142" y="125" width="31" height="6" fill="#c2410c" />
  <rect x="142" y="155" width="31" height="6" fill="#c2410c" />

  <!-- Tower 2 (x: 290) -->
  <rect x="285" y="45" width="10" height="150" fill="#ea580c" />
  <rect x="300" y="45" width="10" height="150" fill="#ea580c" />
  <rect x="282" y="65" width="31" height="6" fill="#c2410c" />
  <rect x="282" y="95" width="31" height="6" fill="#c2410c" />
  <rect x="282" y="125" width="31" height="6" fill="#c2410c" />
  <rect x="282" y="155" width="31" height="6" fill="#c2410c" />

  <!-- Roadway Deck -->
  <rect x="0" y="150" width="400" height="8" fill="#9a3412" />

  <!-- Main Suspension Cables -->
  <path d="M0 110 Q 75 145 150 48 Q 220 145 290 48 Q 350 140 400 120" fill="none" stroke="#ea580c" stroke-width="3" />

  <!-- Vertical Suspension Ropes -->
  <g stroke="#ea580c" stroke-width="1" opacity="0.7">
    <line x1="80" y1="130" x2="80" y2="150" />
    <line x1="110" y1="110" x2="110" y2="150" />
    <line x1="180" y1="90" x2="180" y2="150" />
    <line x1="200" y1="120" x2="200" y2="150" />
    <line x1="220" y1="135" x2="220" y2="150" />
    <line x1="240" y1="125" x2="240" y2="150" />
    <line x1="260" y1="95" x2="260" y2="150" />
    <line x1="330" y1="95" x2="330" y2="150" />
    <line x1="360" y1="120" x2="360" y2="150" />
  </g>

  <!-- Tag Badge -->
  <rect x="220" y="195" width="165" height="30" rx="6" fill="rgba(12, 35, 64, 0.9)" stroke="rgba(255,255,255,0.2)" />
  <text x="232" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🌉 Golden Gate Bridge</text>
</svg>

